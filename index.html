<body>
    <header>
        <div class="header_image">
            <img src="assets/image.png" alt="">
        </div>
        <div class="menu_burger">
            <i class="fa-solid fa-bars"></i>
        </div>
    </header>
    <main>
        <section class="hero_section">
            <h1>Gestion des demandes</h1>
            <p>Suivez et gérez les incidents informatiques.</p>
        </section>
       <section class="form_card">
            <h3>Créer une demande</h3>
            <p>Décrivez votre problème informatique.</p>
            <form id="form_demande">
                <div class="form_group">
                    <label for="titre_du_probléme">Titre du problème *</label>
                    <input type="text" id="titre">
                </div>
                <div class="form_group">
                    <label for="categrie">Catégorie *</label>
                    <select name="categorie" id="categorie">
                        <option value="réseau">Réseau</option>
                        <option value="logiciel">Logiciel</option>
                        <option value="matériel">Matériel</option>
                    </select>
                </div>
                <div class="form_group">
                    <label for="priorite">Priorité *</label>
                    <select name="priorite" id="priorite">
                        <option value="haute">Haute</option>
                        <option value="basses">Basse</option>
                        <option value="haute">Haute</option>
                    </select>
                </div>
                <div class="form_group">
                    <label for="description">Description *</label>
                    <input type="text" id="description">
                </div>
                <button type="submit" id="btnAjouter">＋  Ajouter la demande</button>
            </form>
        </section>
        <span id="compteur">3 demandes</span>
        <div id="liste_des_demandes"></div>
